<style>
/* ==========================================================================
   E-SPb PPDB DESIGN SYSTEM TOKENS & FOUNDATIONS
   Adhering to sovereign government identity with enterprise refinement.
   ========================================================================== */

:root {
  /* Brand Foundations (Federal Navy & Royal Ochre) */
  --gov-navy-950: #061528;
  --gov-navy-900: #0A2342;
  --gov-navy-800: #12345C;
  --gov-navy-700: #1B4573;
  --gov-navy-100: #E8EFF7;

  --gov-gold-600: #B39247;
  --gov-gold-500: #C9A961;
  --gov-gold-400: #DEC486;
  --gov-gold-200: #EEDEB6;
  --gov-gold-100: #FAF6EB;

  /* Surfaces & Canvas */
  --surface-base: #FFFFFF;
  --surface-subtle: #F8FAFC;
  --surface-card: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --surface-overlay: rgba(6, 21, 40, 0.72);

  /* Borders & Dividers */
  --border-subtle: #E2E8F0;
  --border-strong: #CBD5E1;
  --border-focus: #C9A961;

  /* Text & Foreground */
  --text-main: #0B192C;
  --text-muted: #526175;
  --text-dim: #7C8BA0;
  --text-inverse: #FFFFFF;

  /* Status & Feedback */
  --status-success: #15803D;
  --status-success-bg: #F0FDF4;
  --status-success-border: #BBF7D0;

  --status-danger: #B91C1C;
  --status-danger-bg: #FEF2F2;
  --status-danger-border: #FECACA;

  --status-warning: #B45309;
  --status-warning-bg: #FFFBEB;
  --status-warning-border: #FDE68A;

  --status-info: #0369A1;
  --status-info-bg: #F0F9FF;
  --status-info-border: #BAE6FD;

  /* Typography — Sora-inspired: Serif headlines + Modern sans body */
  --font-serif: 'Cormorant Garamond', 'Georgia', serif;
  --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Sizing & Geometry */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Elevation Shadows */
  --shadow-xs: 0 1px 2px rgba(10, 35, 66, 0.04);
  --shadow-sm: 0 2px 6px rgba(10, 35, 66, 0.06);
  --shadow-md: 0 6px 16px rgba(10, 35, 66, 0.08);
  --shadow-lg: 0 12px 32px rgba(10, 35, 66, 0.12);
  --shadow-xl: 0 20px 48px rgba(10, 35, 66, 0.16);

  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* ==========================================================================
   DARK THEME TOKENS
   ========================================================================== */

html.dark-mode,
body.dark-mode {
  --surface-base: #06111E;
  --surface-subtle: #0B192A;
  --surface-card: #0F2238;
  --surface-elevated: #152C48;
  --surface-overlay: rgba(3, 8, 15, 0.82);

  --border-subtle: #1C3552;
  --border-strong: #2A4C73;

  --text-main: #F1F5F9;
  --text-muted: #94A3B8;
  --text-dim: #64748B;

  --status-success-bg: rgba(21, 128, 61, 0.2);
  --status-danger-bg: rgba(185, 28, 28, 0.2);
  --status-warning-bg: rgba(180, 83, 9, 0.2);
  --status-info-bg: rgba(3, 105, 161, 0.2);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.55);
}

/* ==========================================================================
   BASE RESET & TYPOGRAPHY
   ========================================================================== */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background-color: var(--surface-base);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 0.9375rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color var(--transition-normal), color var(--transition-normal);
}

img, svg {
  display: block;
  max-width: 100%;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: 100%;
  max-width: 1220px;
  margin-left: auto;
  margin-right: auto;
  padding-left: 20px;
  padding-right: 20px;
}

/* Headings */
h1, h2, h3, h4, h5 {
  font-weight: 700;
  line-height: 1.25;
  color: var(--gov-navy-900);
}

body.dark-mode h1,
body.dark-mode h2,
body.dark-mode h3,
body.dark-mode h4 {
  color: var(--text-main);
}

h1 { font-size: clamp(2.4rem, 5vw, 4rem); letter-spacing: -0.02em; font-family: var(--font-serif); font-weight: 700; }
h2 { font-size: clamp(1.6rem, 3.5vw, 2.4rem); letter-spacing: -0.02em; font-family: var(--font-serif); }
h3 { font-size: 1.35rem; letter-spacing: -0.01em; }
h4 { font-size: 1.05rem; }

/* ==========================================================================
   GOVERNMENT HEADER BAR
   ========================================================================== */

.gov-bar {
  background-color: var(--gov-navy-950);
  color: #E2E8F0;
  font-size: 0.78125rem;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 0 8px;
  border-bottom: 1px solid rgba(201, 169, 97, 0.28);
}

.gov-bar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.gov-bar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.gov-jata-img {
  width: 24px;
  height: 24px;
  object-fit: contain;
}

.gov-bar-title {
  font-weight: 600;
  letter-spacing: 0.02em;
}

.gov-bar-right {
  display: flex;
  align-items: center;
  gap: 14px;
  color: #94A3B8;
  font-size: 0.75rem;
}

/* ==========================================================================
   PRIMARY NAVIGATION
   ========================================================================== */

.nav-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background-color: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(226, 232, 240, 0.6);
  transition: all var(--transition-normal);
}
body.dark-mode .nav-header {
  background-color: rgba(6, 17, 30, 0.85);
  border-bottom-color: rgba(28, 53, 82, 0.6);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  gap: 20px;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-brand-logo {
  width: 44px;
  height: 44px;
  object-fit: contain;
}

.nav-brand-text {
  display: flex;
  flex-direction: column;
}

.nav-brand-name {
  font-size: 1.125rem;
  font-weight: 800;
  color: var(--gov-navy-900);
  line-height: 1.15;
}

body.dark-mode .nav-brand-name {
  color: var(--gov-gold-400);
}

.nav-brand-sub {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-muted);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-link {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: all var(--transition-fast);
}

.nav-link:hover {
  color: var(--gov-navy-900);
  background-color: var(--surface-subtle);
}

body.dark-mode .nav-link:hover {
  color: var(--text-main);
  background-color: var(--surface-elevated);
}

.nav-link.active {
  color: var(--gov-navy-900);
  background-color: var(--gov-navy-100);
}

body.dark-mode .nav-link.active {
  color: var(--gov-gold-400);
  background-color: var(--surface-elevated);
}

/* ==========================================================================
   DROPDOWN SUBMENU (Unit Sektor)
   ========================================================================== */

.nav-dropdown {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.nav-dropdown-trigger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.nav-dropdown-trigger .nav-chevron {
  transition: transform var(--transition-fast);
}

.nav-dropdown:hover .nav-chevron,
.nav-dropdown.open .nav-chevron {
  transform: rotate(180deg);
}

.nav-dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  min-width: 290px;
  max-width: 340px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  padding: 10px;
  z-index: 250;
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px);
  transition: opacity var(--transition-fast), transform var(--transition-fast), visibility var(--transition-fast);
  pointer-events: none;
  /* Scrollbar / slider styling for small screens & laptops */
  scrollbar-width: thin;
  scrollbar-color: var(--gov-gold-400) var(--surface-subtle);
}

.nav-dropdown-menu::-webkit-scrollbar {
  width: 6px;
}

.nav-dropdown-menu::-webkit-scrollbar-track {
  background: var(--surface-subtle);
  border-radius: 4px;
}

.nav-dropdown-menu::-webkit-scrollbar-thumb {
  background-color: var(--gov-navy-400, #3a506b);
  border-radius: 4px;
}

body.dark-mode .nav-dropdown-menu::-webkit-scrollbar-thumb {
  background-color: var(--gov-gold-400, #f4c430);
}

/* Hover bridge to keep dropdown open across gap */
.nav-dropdown-menu::before {
  content: '';
  position: absolute;
  top: -12px;
  left: 0;
  right: 0;
  height: 12px;
}

.nav-dropdown:hover .nav-dropdown-menu,
.nav-dropdown.open .nav-dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: auto;
}

.nav-dropdown-section {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-dropdown-group-label {
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  padding: 8px 10px 4px;
}

.nav-dropdown-divider {
  height: 1px;
  background-color: var(--border-subtle);
  margin: 6px 4px;
}

.nav-dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  text-decoration: none;
  transition: all var(--transition-fast);
}

.nav-dropdown-item:hover {
  background-color: var(--gov-navy-100);
  color: var(--gov-navy-900);
}

body.dark-mode .nav-dropdown-item:hover {
  background-color: var(--surface-elevated);
  color: var(--gov-gold-400);
}

.nav-dropdown-item.active {
  background-color: var(--gov-navy-100);
  color: var(--gov-navy-900);
  font-weight: 700;
  border-left: 3px solid var(--gov-gold-500);
}

body.dark-mode .nav-dropdown-item.active {
  background-color: var(--surface-elevated);
  color: var(--gov-gold-400);
  border-left: 3px solid var(--gov-gold-400);
}

.nav-dropdown-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: var(--radius-xs);
  background-color: var(--gov-gold-100);
  color: var(--gov-navy-950);
  flex-shrink: 0;
}

body.dark-mode .nav-dropdown-badge {
  background-color: rgba(201, 169, 97, 0.25);
  color: var(--gov-gold-400);
}

.nav-dropdown-item-all {
  color: var(--gov-navy-900);
  font-weight: 700;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--surface-subtle);
  border-radius: var(--radius-sm);
  margin-top: 4px;
}

body.dark-mode .nav-dropdown-item-all {
  color: var(--gov-gold-400);
  background-color: var(--surface-elevated);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Dark mode toggle */
.theme-toggle-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  display: grid;
  place-items: center;
  color: var(--text-muted);
  border: 1px solid var(--border-subtle);
  background-color: var(--surface-card);
  transition: all var(--transition-fast);
}

.theme-toggle-btn:hover {
  color: var(--text-main);
  border-color: var(--border-strong);
}

.theme-toggle-btn svg {
  width: 18px;
  height: 18px;
}

.theme-toggle-btn .moon-icon { display: none; }
html.dark-mode .theme-toggle-btn .sun-icon,
body.dark-mode .theme-toggle-btn .sun-icon { display: none; }
html.dark-mode .theme-toggle-btn .moon-icon,
body.dark-mode .theme-toggle-btn .moon-icon { display: block; }

/* Mobile Menu Toggle */
.mobile-toggle {
  display: none;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  place-items: center;
  color: var(--text-main);
}

.mobile-toggle svg {
  width: 22px;
  height: 22px;
}

/* ==========================================================================
   BUTTONS
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  font-weight: 600;
  line-height: 1.25;
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gov-navy-800), var(--gov-navy-950));
  color: #FFFFFF;
  box-shadow: 0 4px 14px 0 rgba(10, 35, 66, 0.25);
  font-weight: 700;
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--gov-navy-700), var(--gov-navy-900));
  box-shadow: 0 6px 20px rgba(10, 35, 66, 0.35);
  transform: translateY(-2px);
}

body.dark-mode .btn-primary,
html.dark-mode .btn-primary {
  background: linear-gradient(135deg, #D4AF37 0%, #C9A961 100%);
  color: #06111E !important;
  font-weight: 800;
  box-shadow: 0 4px 16px rgba(212, 175, 55, 0.35);
  border: 1px solid #E8CC90;
}

body.dark-mode .btn-primary:hover,
html.dark-mode .btn-primary:hover {
  background: linear-gradient(135deg, #F0D675 0%, #D4AF37 100%);
  box-shadow: 0 6px 24px rgba(212, 175, 55, 0.5);
  transform: translateY(-2px);
}

.btn-gold {
  background-color: var(--gov-gold-500);
  color: var(--gov-navy-950);
  font-weight: 700;
  box-shadow: var(--shadow-sm);
}

.btn-gold:hover {
  background-color: var(--gov-gold-400);
}

.btn-outline {
  border: 1.5px solid var(--border-strong);
  background-color: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  font-weight: 600;
}

.btn-outline:hover {
  border-color: var(--gov-navy-900);
  background-color: var(--surface-subtle);
}

body.dark-mode .btn-outline,
html.dark-mode .btn-outline {
  border: 1.5px solid rgba(201, 169, 97, 0.6);
  background-color: rgba(15, 34, 56, 0.85);
  color: #F1F5F9 !important;
  font-weight: 700;
}

body.dark-mode .btn-outline:hover,
html.dark-mode .btn-outline:hover {
  border-color: #F3E5AB;
  background-color: rgba(201, 169, 97, 0.25);
  color: #FFFFFF !important;
}

/* Hero section outline button — for use on dark backgrounds */
.btn-hero-outline {
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  background-color: transparent;
  color: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(6px);
}

.btn-hero-outline:hover {
  border-color: var(--gov-gold-400);
  background-color: rgba(201, 169, 97, 0.12);
  color: var(--gov-gold-300, #e8cc90);
  transform: translateY(-2px);
}

.btn-hero-gold {
  background: linear-gradient(135deg, var(--gov-gold-500), var(--gov-gold-600));
  color: var(--gov-navy-950);
  font-weight: 700;
  box-shadow: 0 4px 20px rgba(201, 169, 97, 0.3);
  letter-spacing: 0.01em;
}

.btn-hero-gold:hover {
  background: linear-gradient(135deg, var(--gov-gold-400), var(--gov-gold-500));
  box-shadow: 0 6px 28px rgba(201, 169, 97, 0.45);
  transform: translateY(-2px);
}

.btn-danger {
  background-color: var(--status-danger);
  color: #FFFFFF;
}

.btn-danger:hover {
  background-color: #991B1B;
}

.btn-sm {
  padding: 7px 12px;
  font-size: 0.8125rem;
  border-radius: var(--radius-sm);
}

.btn-lg {
  padding: 13px 24px;
  font-size: 1rem;
}

.btn:disabled, .btn[disabled] {
  opacity: 0.55;
  cursor: not-allowed;
  pointer-events: none;
}

/* ==========================================================================
   CARDS & CONTAINERS
   ========================================================================== */

.card {
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-normal);
}

.card:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-lg);
  transform: translateY(-4px);
}

/* ==========================================================================
   HERO SECTION & SHOWCASE CAROUSEL
   ========================================================================== */

.hero-section {
  padding: 48px 0 64px;
  background: linear-gradient(135deg, var(--gov-navy-950) 0%, #0d1f38 50%, var(--gov-navy-900) 100%);
  border-bottom: 1px solid rgba(201, 169, 97, 0.2);
  position: relative;
  overflow: hidden;
}

/* Premium Animated Background Glow for Hero */
.hero-section::before {
  content: '';
  position: absolute;
  top: -20%;
  left: -10%;
  width: 60%;
  height: 80%;
  background: radial-gradient(circle, rgba(201, 169, 97, 0.25) 0%, transparent 60%);
  filter: blur(100px);
  z-index: 0;
  animation: float-glow 8s ease-in-out infinite alternate;
}
.hero-section::after {
  content: '';
  position: absolute;
  bottom: -20%;
  right: -10%;
  width: 50%;
  height: 70%;
  background: radial-gradient(circle, rgba(28, 69, 115, 0.5) 0%, transparent 60%);
  filter: blur(100px);
  z-index: 0;
  animation: float-glow-alt 10s ease-in-out infinite alternate;
}
body.dark-mode .hero-section::after {
  background: radial-gradient(circle, rgba(28, 69, 115, 0.2) 0%, transparent 60%);
}

@keyframes float-glow {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(5%, 5%) scale(1.1); }
}
@keyframes float-glow-alt {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-5%, -5%) scale(1.05); }
}

.hero-grid {
  position: relative;
  z-index: 1;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 48px;
  align-items: center;
}

.hero-identity {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 6px 16px;
  border-radius: var(--radius-full);
  background-color: rgba(201, 169, 97, 0.15);
  border: 1px solid rgba(201, 169, 97, 0.35);
  margin-bottom: 24px;
}

.hero-identity-icon {
  width: 22px;
  height: 22px;
  object-fit: contain;
  flex-shrink: 0;
}

.hero-identity-text {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--gov-gold-400);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.hero-title {
  margin-bottom: 20px;
  line-height: 1.1;
  font-family: var(--font-serif);
  font-size: clamp(2.8rem, 5.5vw, 4.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(110deg, #FFFFFF 40%, var(--gov-gold-400));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fade-up 0.8s ease-out forwards;
}

.hero-description {
  font-size: 1.125rem;
  color: rgba(255, 255, 255, 0.72);
  margin-bottom: 36px;
  max-width: 560px;
  line-height: 1.75;
  letter-spacing: 0.01em;
  animation: fade-up 1s ease-out 0.15s forwards;
  opacity: 0;
}

.hero-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  animation: fade-up 1s ease-out 0.3s forwards;
  opacity: 0;
}

/* Carousel Showcase */
.showcase-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-subtle);
  background-color: var(--gov-navy-950);
}

.showcase-slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 800ms cubic-bezier(0.4, 0, 0.2, 1);
}

.showcase-slide.active {
  opacity: 1;
}

.showcase-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(6, 21, 40, 0.78) 100%);
  pointer-events: none;
}

.showcase-nav-dots {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 5;
}

.showcase-dot {
  width: 10px;
  height: 10px;
  border-radius: var(--radius-full);
  background-color: rgba(255, 255, 255, 0.45);
  border: 1px solid rgba(0, 0, 0, 0.15);
  transition: all var(--transition-fast);
}

.showcase-dot.active {
  width: 28px;
  background-color: var(--gov-gold-500);
}

/* ==========================================================================
   SECTIONS & GRIDS
   ========================================================================== */

.section {
  padding: 80px 0;
}

.section-alt {
  background-color: var(--surface-subtle);
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}

.section-header {
  margin-bottom: 48px;
}

.section-label {
  display: inline-block;
  font-size: 0.6875rem;
  font-weight: 700;
  color: var(--gov-gold-600);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--gov-gold-500);
}

body.dark-mode .section-label {
  color: var(--gov-gold-400);
  border-bottom-color: var(--gov-gold-400);
}

.section-subtitle {
  color: var(--text-muted);
  font-size: 1.0625rem;
  margin-top: 10px;
  max-width: 680px;
  line-height: 1.7;
}

/* Quick Access Grid */
.quick-access-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.quick-card {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 20px;
  border-radius: var(--radius-lg);
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  transition: all var(--transition-normal);
}

.quick-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
}

.quick-card-icon {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background-color: var(--gov-navy-100);
  color: var(--gov-navy-900);
  display: grid;
  place-items: center;
}

body.dark-mode .quick-card-icon {
  background-color: var(--surface-elevated);
  color: var(--gov-gold-400);
}

.quick-card-icon svg {
  width: 22px;
  height: 22px;
}

.quick-card-content h3 {
  font-size: 1rem;
  margin-bottom: 4px;
}

.quick-card-content p {
  font-size: 0.8125rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* Units Hierarchy Section */
.unit-category-block {
  margin-bottom: 48px;
}

.unit-category-block:last-child {
  margin-bottom: 0;
}

.unit-category-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.25rem;
  margin-bottom: 8px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--gov-gold-500);
}

.unit-category-title svg {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.unit-category-desc {
  font-size: 0.875rem;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.unit-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.unit-card {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 22px;
  border-radius: var(--radius-lg);
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  transition: all var(--transition-normal);
}

.unit-card:hover {
  transform: translateY(-3px);
  border-color: var(--gov-gold-500);
  box-shadow: var(--shadow-md);
}

.unit-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.unit-card-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background-color: var(--gov-navy-100);
  color: var(--gov-navy-900);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.unit-card-icon svg {
  width: 20px;
  height: 20px;
}

body.dark-mode .unit-card-icon {
  background-color: var(--surface-elevated);
  color: var(--gov-gold-400);
}

.unit-card-icon svg {
  width: 18px;
  height: 18px;
}

.unit-card h4 {
  font-size: 1rem;
}

.unit-card p {
  font-size: 0.8125rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 16px;
  flex-grow: 1;
}

.unit-card-link-text {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--gov-navy-800);
}

body.dark-mode .unit-card-link-text {
  color: var(--gov-gold-400);
}

/* Hebahan (Announcements) Grid */
.announcements-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
  gap: 24px;
}

.announcement-card {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-normal);
}

.announcement-card:hover {
  transform: translateY(-3px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
}

.announcement-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background-color: var(--surface-subtle);
  overflow: hidden;
}

.announcement-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 400ms ease;
}

.announcement-img-wrap .hover-hint {
  opacity: 0;
  transition: opacity 0.2s ease;
}
.announcement-img-wrap:hover .hover-hint {
  opacity: 1;
}

.announcement-card:hover .announcement-img {
  transform: scale(1.03);
}

.announcement-body {
  display: flex;
  flex-direction: column;
  padding: 20px;
  flex-grow: 1;
}

.announcement-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.announcement-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: var(--radius-xs);
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background-color: var(--gov-navy-100);
  color: var(--gov-navy-900);
}

body.dark-mode .announcement-badge {
  background-color: var(--surface-elevated);
  color: var(--gov-gold-400);
}

.announcement-date {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-dim);
}

.announcement-body h3 {
  font-size: 1.05rem;
  line-height: 1.35;
  margin-bottom: 8px;
}

.announcement-body p {
  font-size: 0.84375rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 16px;
  flex-grow: 1;
}

.announcement-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--gov-navy-900);
}

body.dark-mode .announcement-link {
  color: var(--gov-gold-400);
}

/* ==========================================================================
   UNIT SUB-PORTAL VIEW (Documents & Curriculum)
   ========================================================================== */

.unit-banner {
  background: linear-gradient(135deg, var(--gov-navy-950) 0%, var(--gov-navy-800) 100%);
  color: #FFFFFF;
  padding: 56px 0;
  border-bottom: 3px solid var(--gov-gold-500);
}

.unit-banner-content {
  display: flex;
  align-items: center;
  gap: 32px;
}

.unit-banner-logo {
  width: 90px;
  height: 90px;
  object-fit: contain;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
}

.unit-banner-title {
  color: #FFFFFF;
  margin-bottom: 8px;
}

.unit-banner-tagline {
  font-size: 1.0625rem;
  color: var(--gov-gold-200);
  max-width: 720px;
}

/* Document Controls Toolbar */
.doc-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 28px;
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
}

.doc-search-box {
  position: relative;
  flex-grow: 1;
  max-width: 400px;
}

.doc-search-box input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  background-color: var(--surface-base);
  font-size: 0.875rem;
  outline: none;
}

.doc-search-box input:focus {
  border-color: var(--gov-gold-500);
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.2);
}

.doc-search-box svg {
  position: absolute;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-dim);
}

.doc-filter-tabs {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.doc-tab {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-muted);
  border: 1px solid transparent;
  transition: all var(--transition-fast);
}

.doc-tab:hover {
  background-color: var(--surface-subtle);
  color: var(--text-main);
}

.doc-tab.active {
  background-color: var(--gov-navy-900);
  color: #FFFFFF;
}

body.dark-mode .doc-tab.active {
  background-color: var(--gov-gold-500);
  color: var(--gov-navy-950);
}

/* Document Grid */
.doc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
}

.doc-card {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-normal);
}

.doc-card:hover {
  transform: translateY(-3px);
  border-color: var(--gov-gold-500);
  box-shadow: var(--shadow-md);
}

.doc-card-thumb-wrap {
  position: relative;
  width: 100%;
  height: 160px;
  background-color: var(--surface-subtle);
  border-bottom: 1px solid var(--border-subtle);
  display: grid;
  place-items: center;
  overflow: hidden;
}

.doc-card-thumb-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.doc-badge-type {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 4px 8px;
  border-radius: var(--radius-xs);
  background-color: rgba(6, 21, 40, 0.82);
  color: #FFFFFF;
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.doc-card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.doc-card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-dim);
  font-weight: 600;
  margin-bottom: 8px;
}

.doc-card-title {
  font-size: 1rem;
  line-height: 1.4;
  margin-bottom: 18px;
  flex-grow: 1;
}

.doc-card-actions {
  display: flex;
  gap: 10px;
}

.doc-card-actions .btn {
  flex: 1;
}

/* ==========================================================================
   COMPLETE UNIT PAGE SECTIONS & COMPONENTS
   ========================================================================== */

.unit-overview-grid {
  display: grid;
  grid-template-columns: 1.8fr 1.2fr;
  gap: 28px;
  margin-bottom: 36px;
}

@media (max-width: 960px) {
  .unit-overview-grid {
    grid-template-columns: 1fr;
  }
}

.unit-badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 700;
  background-color: var(--gov-gold-100);
  color: var(--gov-navy-950);
  margin-bottom: 12px;
  letter-spacing: 0.02em;
}

body.dark-mode .unit-badge-pill {
  background-color: rgba(201, 169, 97, 0.25);
  color: var(--gov-gold-300);
}

.unit-responsibilities-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 16px;
}

.unit-responsibility-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 0.9rem;
  line-height: 1.5;
  color: var(--text-main);
}

.unit-check-icon {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background-color: var(--status-success-bg);
  color: var(--status-success);
  display: grid;
  place-items: center;
  margin-top: 2px;
  border: 1px solid var(--status-success-border);
}

.unit-check-icon svg {
  width: 12px;
  height: 12px;
  stroke-width: 3;
}

.unit-services-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}

.unit-service-card {
  padding: 14px 16px;
  border-radius: var(--radius-md);
  background-color: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  font-size: 0.875rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-main);
  transition: all var(--transition-fast);
}

.unit-service-card:hover {
  border-color: var(--gov-gold-500);
  background-color: var(--surface-card);
  transform: translateX(3px);
}

.unit-service-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background-color: var(--gov-navy-100);
  color: var(--gov-navy-900);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

body.dark-mode .unit-service-icon {
  background-color: var(--surface-elevated);
  color: var(--gov-gold-400);
}

.unit-service-icon svg {
  width: 16px;
  height: 16px;
}

.unit-contact-card {
  background: linear-gradient(135deg, var(--surface-card) 0%, var(--surface-subtle) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
}

.unit-contact-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.84375rem;
  margin-top: 10px;
  color: var(--text-muted);
}

.unit-contact-item svg {
  width: 16px;
  height: 16px;
  color: var(--gov-gold-600);
  flex-shrink: 0;
}

/* Informational Card for Units without Drive Documents */
.unit-info-banner-card {
  padding: 32px;
  border-radius: var(--radius-lg);
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.unit-info-icon-bubble {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background-color: var(--gov-navy-100);
  color: var(--gov-navy-900);
  display: grid;
  place-items: center;
}

body.dark-mode .unit-info-icon-bubble {
  background-color: var(--surface-elevated);
  color: var(--gov-gold-400);
}

.unit-info-icon-bubble svg {
  width: 28px;
  height: 28px;
}

.unit-external-portal-card {
  background: linear-gradient(135deg, rgba(10, 35, 66, 0.04) 0%, rgba(201, 169, 97, 0.12) 100%);
  border: 1px solid var(--gov-gold-400);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 28px;
}

body.dark-mode .unit-external-portal-card {
  background: linear-gradient(135deg, rgba(15, 34, 56, 0.8) 0%, rgba(201, 169, 97, 0.1) 100%);
  border-color: var(--gov-gold-500);
}

/* ==========================================================================
   ADMIN MANAGEMENT CONSOLE
   ========================================================================== */

.admin-header-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 20px;
  padding: 28px;
  border-radius: var(--radius-xl);
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-sm);
  margin-bottom: 32px;
}

/* Unit Employees Grid */
.unit-employees-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
  gap: 16px;
}

.employee-card {
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}

.employee-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.admin-nav-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 12px;
}

.admin-nav-tab {
  padding: 10px 18px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.875rem;
  color: var(--text-muted);
  transition: all var(--transition-fast);
}

.admin-nav-tab:hover {
  background-color: var(--surface-subtle);
  color: var(--text-main);
}

.admin-nav-tab.active {
  background-color: var(--gov-navy-900);
  color: #FFFFFF;
}

body.dark-mode .admin-nav-tab.active {
  background-color: var(--gov-gold-500);
  color: var(--gov-navy-950);
}

/* Data Table */
.table-responsive {
  width: 100%;
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  background-color: var(--surface-card);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.875rem;
}

.data-table th {
  padding: 14px 18px;
  background-color: var(--surface-subtle);
  font-weight: 700;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
}

.data-table td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-main);
  vertical-align: middle;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tr:hover td {
  background-color: var(--surface-subtle);
}

.table-thumb {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-sm);
  object-fit: cover;
}

/* Forms */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 0.84375rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text-main);
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  background-color: var(--surface-base);
  color: var(--text-main);
  font-size: 0.875rem;
  outline: none;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--gov-gold-500);
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.2);
}

.form-help {
  display: block;
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 4px;
}

/* Image Upload Dropzone */
.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 32px 20px;
  text-align: center;
  background-color: var(--surface-subtle);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.dropzone:hover {
  border-color: var(--gov-gold-500);
  background-color: rgba(201, 169, 97, 0.05);
}

.dropzone svg {
  width: 40px;
  height: 40px;
  margin: 0 auto 12px;
  color: var(--gov-gold-600);
}

/* ==========================================================================
   MODAL DIALOGS
   ========================================================================== */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background-color: var(--surface-overlay);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-normal);
}

.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.modal-dialog {
  width: 100%;
  max-width: 560px;
  background-color: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xl);
  overflow: hidden;
  transform: translateY(20px) scale(0.98);
  transition: transform var(--transition-normal);
}

.modal-backdrop.open .modal-dialog {
  transform: translateY(0) scale(1);
}

.modal-dialog-lg {
  max-width: 900px;
}

.modal-header {
  display: flex;
  align-items: center;
