<script>
/**
 * ============================================================================
 * E-SPb PPDB Core Client Runtime
 * State management, Promise-based API client, Toast notifications,
 * Dark mode, Mobile drawer, Modal controller, and Canvas Image Compressor.
 * ============================================================================
 */

(function() {
  'use strict';

  // ==========================================
  // STATE MANAGEMENT
  // ==========================================
  const state = {
    sessionToken: window.SafeSession.getItem('espb_admin_token') || null,
    isAdminLoggedIn: false,
    activeHeroIndex: 0,
    heroTimer: null,
    heroImages: []
  };

  // ==========================================
  // API CLIENT (Promise-based Wrapper)
  // ==========================================
  function apiCall(functionName, ...args) {
    return new Promise(function(resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        console.warn('Google Script runtime not found (local preview mode).');
        reject(new Error('Google Script runtime unavailable.'));
        return;
      }

      const runner = google.script.run
        .withSuccessHandler(function(response) {
          resolve(response);
        })
        .withFailureHandler(function(error) {
          console.error('API Error in ' + functionName + ':', error);
          showToast(error.message || 'Ralat komunikasi pelayan.', 'error');
          reject(error);
        });

      if (typeof runner[functionName] !== 'function') {
        const errMsg = 'Fungsi pelayan ' + functionName + ' tidak wujud.';
        console.error(errMsg);
        reject(new Error(errMsg));
        return;
      }

      runner[functionName].apply(runner, args);
    });
  }

  // ==========================================
  // TOAST NOTIFICATIONS
  // ==========================================
  function showToast(message, type, durationMs) {
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      container.className = 'toast-container';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.className = 'toast toast-' + (type || 'info');
    toast.setAttribute('role', 'alert');

    let iconSvg = getIconSvg('check');
    if (type === 'error') iconSvg = getIconSvg('alert-circle');
    else if (type === 'warning') iconSvg = getIconSvg('alert-triangle');

    toast.innerHTML = `
      <div style="flex-shrink:0;">${iconSvg}</div>
      <div style="flex-grow:1;">${escapeHtml(message)}</div>
      <button type="button" onclick="this.parentElement.remove()" style="opacity:0.6;padding:4px;cursor:pointer;background:none;border:none;" aria-label="Tutup">&times;</button>
    `;

    container.appendChild(toast);

    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(20px)';
      toast.style.transition = 'all 200ms ease';
      setTimeout(function() { toast.remove(); }, 200);
    }, durationMs || 4500);
  }

  // ==========================================
  // THEME (DARK MODE) CONTROLLER
  // ==========================================
  function initTheme() {
    try {
      const saved = window.SafeLocal.getItem('espb_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        if (document.body) document.body.classList.add('dark-mode');
        if (document.documentElement) document.documentElement.classList.add('dark-mode');
      } else {
        if (document.body) document.body.classList.remove('dark-mode');
        if (document.documentElement) document.documentElement.classList.remove('dark-mode');
      }
    } catch(e) {}
  }

  function toggleTheme() {
    if (typeof window.toggleDarkMode === 'function' && window.toggleDarkMode !== toggleTheme) {
      return window.toggleDarkMode();
    }
    const isDark = document.body ? document.body.classList.toggle('dark-mode') : false;
    if (document.documentElement) {
      if (isDark) document.documentElement.classList.add('dark-mode');
      else document.documentElement.classList.remove('dark-mode');
    }
    try {
      window.SafeLocal.setItem('espb_theme', isDark ? 'dark' : 'light');
    } catch (e) {}
    showToast(isDark ? 'Mod gelap diaktifkan.' : 'Mod terang diaktifkan.', 'info', 2000);
    return isDark;
  }

  // ==========================================
  // MOBILE NAVIGATION DRAWER
  // ==========================================
  function openMobileMenu() {
    const drawer = document.getElementById('mobileDrawer');
    if (drawer) {
      drawer.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
    }
  }

  function closeMobileMenu() {
    const drawer = document.getElementById('mobileDrawer');
    if (drawer) {
      drawer.classList.remove('open');
      drawer.setAttribute('aria-hidden', 'true');
    }
  }

  // ==========================================
  // MODAL CONTROLLER
  // ==========================================
  function openModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      const focusable = modal.querySelector('input, button:not([disabled]), select, textarea');
      if (focusable) focusable.focus();
    }
  }

  function cleanupDocPreview() {
    const img = document.getElementById('docPreviewImage');
    if (img) img.src = '';
    const pdfCont = document.getElementById('docPreviewPdfContainer');
    if (pdfCont) pdfCont.innerHTML = '';
    const badge = document.getElementById('docPreviewPageCount');
    if (badge) { badge.textContent = ''; badge.style.display = 'none'; }
    const other = document.getElementById('docPreviewOtherType');
    if (other) other.style.display = 'none';
  }

  function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      if (modalId === 'docPreviewModal') {
        cleanupDocPreview();
      }
    }
  }

  // Close modal when clicking backdrop
  document.addEventListener('click', function(e) {
    if (e.target.classList && e.target.classList.contains('modal-backdrop')) {
      e.target.classList.remove('open');
      document.body.style.overflow = '';
      cleanupDocPreview();
    }
  });

  // Close on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-backdrop.open').forEach(function(m) {
        m.classList.remove('open');
      });
      closeMobileMenu();
      document.body.style.overflow = '';
      cleanupDocPreview();
    }
  });

  // ==========================================
  // CLIENT-SIDE IMAGE COMPRESSOR (HTML5 Canvas)
  // Reduces heavy photo uploads from 15MB down to ~300KB
  // ==========================================
  function compressImageFile(file, maxWidth, maxHeight, quality) {
    return new Promise(function(resolve, reject) {
      if (!file || !file.type.match(/image.*/)) {
        reject(new Error('Sila pilih fail imej yang sah.'));
        return;
      }

      const maxW = maxWidth || 1600;
      const maxH = maxHeight || 1200;
      const q = quality || 0.85;

      const reader = new FileReader();
      reader.onload = function(readerEvent) {
        const image = new Image();
        image.onload = function() {
          let w = image.width;
          let h = image.height;

          if (w > maxW || h > maxH) {
            if (w / maxW > h / maxH) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            } else {
              w = Math.round((w * maxH) / h);
              h = maxH;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(image, 0, 0, w, h);

          const compressedBase64 = canvas.toDataURL('image/jpeg', q);
          resolve({
            data: compressedBase64,
            contentType: 'image/jpeg',
            fileName: file.name
          });
        };
        image.onerror = function() { reject(new Error('Imej rosak atau tidak dapat diproses.')); };
        image.src = readerEvent.target.result;
      };
      reader.onerror = function() { reject(new Error('Gagal membaca fail.')); };
      reader.readAsDataURL(file);
    });
  }

      'plus': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
      'lock': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'

    return icons[name] || icons['folder'];
  }

  // ==========================================
  // ESCAPE HTML HELPER
  // ==========================================
  function escapeHtml(text) {
    if (!text && text !== 0) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Build the global ESPB API object
  const ESPB_INSTANCE = {
    state: state,
    apiCall: apiCall,
    showToast: showToast,
    toggleTheme: toggleTheme,
    initTheme: initTheme,
    openMobileMenu: openMobileMenu,
    closeMobileMenu: closeMobileMenu,
    openModal: openModal,
    closeModal: closeModal,
    compressImageFile: compressImageFile,
    getIconSvg: getIconSvg,
    escapeHtml: escapeHtml
  };

  // Expose both on window.ESPB and as standalone globals for safety
  window.ESPB = ESPB_INSTANCE;
  window.toggleDarkMode = toggleTheme;
  window.openMobileMenu = openMobileMenu;
  window.closeMobileMenu = closeMobileMenu;
  window.openModal = openModal;
  window.closeModal = closeModal;

  window.loadBase64FallbackImage = function(imgEl, fileId, fallbackUrl) {
    if (imgEl.dataset.fallbackTriggered) return;
    imgEl.dataset.fallbackTriggered = 'true';
    imgEl.onerror = function() { this.src = fallbackUrl; };
    apiCall('getImageBase64', fileId)
      .then(function(res) {
        if (res && res.success) {
          imgEl.src = res.data;
        } else {
          imgEl.src = fallbackUrl;
        }
      })
      .catch(function() {
        imgEl.src = fallbackUrl;
      });
  };

  // Scroll Reveal Animations
  function initScrollReveal() {
    if (!window.IntersectionObserver) return;
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.reveal-on-scroll').forEach(function(el) { observer.observe(el); });
    
    ESPB_INSTANCE.observeNewElements = function(container) {
      if (!container) return;
      container.querySelectorAll('.reveal-on-scroll').forEach(function(el) { observer.observe(el); });
    };
  }

  document.addEventListener('DOMContentLoaded', function() {
    try {
        initScrollReveal();
    } catch(e) {
        console.warn('Scroll reveal initialization failed:', e);
    }
  });

  // --- UI PRO MAX EXTENSIONS ---
  function initProMaxUX() {
    // Spotlight Effect for Cards
    document.addEventListener('mousemove', function(e) {
      document.querySelectorAll('.card').forEach(function(card) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);
      });
    });

    // Ripple Effect for Buttons
    document.addEventListener('click', function(e) {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      
      const rect = btn.getBoundingClientRect();
      const circle = document.createElement('span');
      const diameter = Math.max(btn.clientWidth, btn.clientHeight);
      const radius = diameter / 2;
      
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - rect.left - radius}px`;
      circle.style.top = `${e.clientY - rect.top - radius}px`;
      circle.classList.add('ripple');
      
      const ripple = btn.querySelector('.ripple');
      if (ripple) ripple.remove();
      
      btn.appendChild(circle);
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    try {
        initProMaxUX();
    } catch(e) {
        console.warn('Pro Max UX initialization failed:', e);
    }
  });

  // Run initial theme check
  initTheme();
})();
</script>
